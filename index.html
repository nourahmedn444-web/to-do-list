<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <h2 id="demo">Lorem ipsum dolor sit amet consectetur.</h2>
    <button data-color="red" data-location="right">color1</button>
    <button data-color="blue" data-location="left">color2</button>
    <button data-color="yellow" data-location="center">color3</button>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-10 m-auto">
          <h3 class="text-center">To Do list</h3>
          <form id="myform">
            <input
              type="text"
              id="works"
              class="form-control my-3"
              placeholder="Enter your works"
            />
            <input
              type="submit"
              value="Enter"
              class="d-block w-100 btn btn-primary"
            />
          </form>
          <ul id="result"></ul>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
